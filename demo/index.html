<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>domo.js Feature Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2em;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #f4f4f4;
      }
      .success {
        color: green;
      }
      .fail {
        color: red;
      }
      .pending {
        color: orange;
      }
    </style>
  </head>
  <body>
    <h1>domo.js Feature Report</h1>
    <button id="runTests">Run All Feature Tests</button>
    <table id="reportTable">
      <thead>
        <tr>
          <th>Feature</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="domo.js"></script>
    <script>
      (function () {
        if (!domo) {
          console.error("domo.js is not loaded.");
          document.body.innerHTML = "<h2>Error: domo.js is not loaded.</h2>";
          return;
        }

        const STATUS_LABELS = {
          success: "Success",
          fail: "Fail",
          pending: "Pending",
        };
        const EVENT_FEATURES = [
          "onDataUpdated",
          "onFiltersUpdated",
          "onVariablesUpdated",
          "onAppDataUpdated",
        ];

        const features = [
          {
            name: "http-post",
            fn: async () => {
              if (!domo.post) throw new Error("Not implemented");
              const res = await domo.post(
                "/domo/datastores/v1/collections/SanityTest/documents/",
                { foo: "bar" }
              );
              if (!res?.id) throw new Error("POST did not return an ID");
              lastId = res.id;
              return res;
            },
          },
          {
            name: "http-put",
            fn: async () => {
              if (!lastId) throw new Error("No ID from POST");
              if (!domo.put) throw new Error("Not implemented");
              return domo.put(
                `/domo/datastores/v1/collections/SanityTest/documents/${lastId}`,
                { foo: "baz" }
              );
            },
          },
          {
            name: "http-delete",
            fn: async () => {
              if (!lastId) throw new Error("No ID from POST");
              if (!domo.delete) throw new Error("Not implemented");
              return domo.delete(
                `/domo/datastores/v1/collections/SanityTest/documents/${lastId}`
              );
            },
          },
          {
            name: "http-get",
            fn: async () => {
              if (!domo.get) throw new Error("Not implemented");
              return domo.get(
                "/domo/datastores/v1/collections/SanityTest/documents/"
              );
            },
          },
          {
            name: "requestFiltersUpdate",
            fn: () => {
              if (!domo.requestFiltersUpdate) throw new Error("Not implemented");
              return domo.requestFiltersUpdate();
            },
          },
          {
            name: "requestVariablesUpdate",
            fn: () => {
              if (!domo.requestVariablesUpdate) throw new Error("Not implemented");

              const payload = {
                "83942": {
                  "parsedExpression": {
                    "exprType": "NUMERIC_VALUE",
                    "value": "1"
                  }
                }
              };

              console.log("DomoApp: requestVariablesUpdate", payload);
              return domo.requestVariablesUpdate(payload);
            },
          },
          {
            name: "onDataUpdated",
            fn: () => new Promise(),
            pendingMsg:
              'This will run when you change <a href="https://domo.demo.domo.com/datasources/f8956b7f-13cf-45f1-96dd-a27ed3910c18/details/overview" target="_blank">this dataset</a>.',
          },
          {
            name: "onFiltersUpdated",
            fn: () => new Promise(),
            pendingMsg:
              "This will run when you add or modify any filter on this page.",
          },
          {
            name: "onVariablesUpdated",
            fn: () => new Promise(),
            pendingMsg:
              "To trigger this, change the variable at the top of this page.",
          },
          {
            name: "onAppDataUpdated",
            fn: () => new Promise(),
            pendingMsg:
              "To trigger this, click the 'Send App Data' button—this app must be embedded.",
          },
          {
            name: "requestAppDataUpdate",
            fn: () => {
              if (!domo.requestAppDataUpdate) throw new Error("Not implemented");
              return domo.requestAppDataUpdate("onAppDataUpdated works");
            },
            customButton: true,
          },
        ];

        let lastId = null;
        let lastAppData = null;
        const tbody = document.querySelector("#reportTable tbody");

        // 1) Build initial rows
        features.forEach(({ name, pendingMsg, customButton }) => {
          const tr = document.createElement("tr");
          tr.id = `row-${name}`;
          tr.innerHTML = `
            <td>${name}</td>
            <td><span class="pending">${STATUS_LABELS.pending}</span></td>
            <td>${pendingMsg || ""}</td>
          `;
          tbody.appendChild(tr);
          if (customButton) setupRequestAppDataUpdate();
        });

        // 2) Register domo event callbacks in a loop
        EVENT_FEATURES.forEach((eventName) => {
          try {
            console.log(`Registering event: ${eventName}`);
            domo[eventName]((arg) => {
              console.log(`Event ${eventName} triggered with:`, arg);
              const msg =
                eventName === "onDataUpdated"
                  ? `Callback ran with alias: ${arg}`
                  : eventName === "onAppDataUpdated"
                  ? `Callback ran. Data: ${arg}`
                  : "Callback ran successfully.";
              updateRow(eventName, "success", msg);
            });
          } catch (e) {
            console.error(`Error registering ${eventName}:`, e);
            updateRow(eventName, "fail", e.message);
          }
        });

        // 3) Wire up "Send App Data" button once
        function setupRequestAppDataUpdate() {
          const row = document.getElementById("row-requestAppDataUpdate");
          const cell = row.children[2];
          if (cell.querySelector("#requestAppDataUpdateBtn")) return;

          const btn = document.createElement("button");
          btn.id = "requestAppDataUpdateBtn";
          btn.textContent = "Send App Data";
          const resultSpan = document.createElement("span");
          resultSpan.id = "requestAppDataUpdateResult";

          btn.addEventListener("click", async () => {
            try {
              await features.find((f) => f.name === "requestAppDataUpdate").fn();
              resultSpan.textContent = "Sent!";
            } catch (e) {
              resultSpan.textContent = `Failed: ${e?.message || e}`;
            }
          });

          cell.append(btn, " ", resultSpan);
        }

        // 4) Run non-event tests sequentially
        async function runAllTests() {
          for (const { name } of features) {
            if (EVENT_FEATURES.includes(name) || name === "requestAppDataUpdate")
              continue;
            updateRow(name, "pending", ""); // reset status
          }
          for (const feat of features) {
            const { name, fn } = feat;
            if (EVENT_FEATURES.includes(name) || name === "requestAppDataUpdate")
              continue;
            try {
              const res = await fn();
              const detail =
                typeof res === "string" ? res : JSON.stringify(res);
              updateRow(name, "success", detail);
            } catch (e) {
              updateRow(name, "fail", e.message || String(e));
            }
          }
        }

        // 5) Helper to update a row
        function updateRow(name, status, details = "") {
          const row = document.getElementById(`row-${name}`);
          if (!row) return;
          row.children[1].innerHTML = `<span class="${status}">${
            STATUS_LABELS[status] || STATUS_LABELS.pending
          }</span>`;
          // Don’t overwrite details for event-driven features or "requestAppDataUpdate"
          if (!EVENT_FEATURES.includes(name) && name !== "requestAppDataUpdate") {
            row.children[2].textContent = details;
          }
        }

        document
          .getElementById("runTests")
          .addEventListener("click", runAllTests);
      })();
    </script>
  </body>
</html>
