<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>domo.js Feature Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public-assets/assets/css/styles.css">

  <!-- Synchronously load the chosen ryuu.js version before any app code -->
  <script>
    var RYUUJS_VERSIONS = [
      "5.1.4","5.1.3","5.1.2","5.1.1","5.1.0",
      "5.0.1","5.0.0",
      "4.7.0","4.6.0","4.5.0","4.4.1","4.4.0","4.3.1","4.3.0",
      "4.2.0","4.1.1","4.1.0","4.0.1","4.0.0",
      "3.0.6","3.0.5","3.0.4","3.0.3","3.0.2","3.0.1","3.0.0",
      "2.6.8","2.6.7","2.6.5","2.6.4","2.6.3","2.6.2","2.6.1","2.6.0",
      "2.5.10","2.5.9","2.5.8","2.5.7","2.5.6","2.5.5","2.5.4","2.5.3","2.5.2","2.5.1","2.5.0",
      "2.4.1","2.4.0","2.3.1","2.3.0","2.2.0","2.1.2","2.1.1","2.1.0","2.0.4","2.0.3","2.0.2","2.0.1"
    ];
    var RYUUJS_CHOSEN = new URLSearchParams(window.location.search).get("v") || "local";
    var _src = RYUUJS_CHOSEN === "local"
      ? "public-assets/domo.js"
      : "https://cdn.jsdelivr.net/npm/ryuu.js@" + RYUUJS_CHOSEN + "/dist/domo.js";
    document.write('<script src="' + _src + '"><\/script>');
  </script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>domo.js</h1>
      <p>Feature report &amp; interactive test suite</p>

      <div class="header__meta">
        <!-- Version Picker -->
        <div class="version-picker" id="versionPicker">
          <label class="version-picker__label" for="versionSelect">ryuu.js</label>
          <div class="version-picker__control">
            <select class="version-picker__select" id="versionSelect"></select>
            <span class="version-picker__badge" id="versionSource">local</span>
          </div>
        </div>

        <!-- Device Badge -->
        <div id="deviceInfo" class="device-detection-header">
          <div class="device-status">
            <span>Device</span>
            <span id="deviceType" class="device-badge">Detecting...</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Event Warning Banner -->
    <div class="event-banner" id="eventBanner">
      <div class="event-banner__glow"></div>
      <div class="event-banner__content">
        <div class="event-banner__icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2L1 18h18L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M10 8v4M10 14.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="event-banner__text">
          <strong>Events not registered</strong>
          <span>The app will refresh on data changes instead of updating in place</span>
        </div>
        <button class="event-banner__action" id="bannerRegisterBtn">Register Now</button>
      </div>
    </div>

    <!-- Controls -->
    <section class="controls">
      <button id="runTests" class="btn">
        <span class="spinner" id="spinner" style="display: none;"></span>
        <span id="runTestsText">Run All Tests</span>
      </button>
      <button id="clearResults" class="btn btn-secondary">Clear</button>
      <button id="exportResults" class="btn btn-secondary">Export</button>
      <div class="stats">
        <div class="stat">
          <span>Total</span>
          <span class="stat-value" id="totalTests">0</span>
        </div>
        <div class="stat stat--passed">
          <span>Pass</span>
          <span class="stat-value" id="passedTests">0</span>
        </div>
        <div class="stat stat--failed">
          <span>Fail</span>
          <span class="stat-value" id="failedTests">0</span>
        </div>
        <div class="stat stat--pending">
          <span>Pending</span>
          <span class="stat-value" id="pendingTests">0</span>
        </div>
      </div>
    </section>

    <!-- Test cards rendered by JS -->
    <main class="content" id="testContent">
      <!-- Category groups injected here -->
    </main>

    <!-- Hidden table kept for stats/export compat -->
    <table id="reportTable">
      <thead><tr><th>API Method</th><th>Status</th><th>Details</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- App scripts — domo.js is already loaded synchronously from <head> -->
  <script src="public-assets/assets/js/tests.js"></script>
  <script src="public-assets/assets/js/utils.js"></script>
  <script src="public-assets/assets/js/app.js"></script>
</body>
</html>
