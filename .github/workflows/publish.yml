# Publishes one pipeline tag to npm. Dispatched by release.yml on the tag ref, so
# provenance points at the exact commit that was built. Safe to re-run: a version
# already on npm is skipped. Keep this file small: each tag runs its own copy.
name: Publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ryuu-publish
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify the tag
        id: check
        run: |
          plan=$(scripts/ci/verify-tag.sh "$GITHUB_REF_NAME")
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip == 'false'
        run: npm ci --ignore-scripts
      - if: steps.check.outputs.skip == 'false'
        run: npm run typecheck && npm test && npm run build
      - name: Pack
        if: steps.check.outputs.skip == 'false'
        run: npm pack --ignore-scripts
      - name: Check GA matches the soaked beta
        if: steps.check.outputs.skip == 'false' && steps.check.outputs.dist_tag == 'latest'
        run: |
          npm pack "ryuu.js@$SOAKED" --pack-destination "$RUNNER_TEMP"
          scripts/ci/same-artifact.sh "$RUNNER_TEMP/ryuu.js-$SOAKED.tgz" "ryuu.js-$VERSION.tgz"
        env:
          SOAKED: ${{ steps.check.outputs.soaked }}
          VERSION: ${{ steps.check.outputs.version }}
      - if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ryuu.js-${{ steps.check.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      actions: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      - name: Publish ryuu.js@${{ needs.build.outputs.version }} as ${{ needs.build.outputs.dist_tag }}
        run: npm publish "./ryuu.js-$VERSION.tgz" --tag "$DIST_TAG"
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
      - name: Wait until the registry serves it
        run: |
          for _ in $(seq 20); do
            [ -n "$(npm view "ryuu.js@$VERSION" version --prefer-online 2>/dev/null)" ] && exit 0
            sleep 15
          done
          echo "::error::ryuu.js@$VERSION was published but is not visible yet"
          exit 1
        env:
          VERSION: ${{ needs.build.outputs.version }}
      # Lets a merge that queued behind this publish get its beta without waiting for cron.
      - name: Hand back to the release workflow
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f dry_run=false
        env:
          GH_TOKEN: ${{ github.token }}
