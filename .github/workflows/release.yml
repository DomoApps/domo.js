# Decides the next release step from npm, git and Jira state, and takes at most one
# irreversible action per run. Model and runbook: RELEASING.md.
name: Release

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan, build and test, but push and publish nothing
        type: boolean
        default: true
      force_ga:
        description: Promote the current beta to GA now, skipping the soak and the Jira check
        type: boolean
        default: false
      simulate_now:
        description: 'Dry run only: plan as if it were this time (+15d, or an ISO timestamp)'
        type: string
        default: ''

permissions: {}

concurrency:
  group: ryuu-release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
  SIMULATE_NOW: ${{ inputs.simulate_now }}
  JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
  JIRA_PROJECTS: ${{ vars.JIRA_PROJECTS }}

jobs:
  reconcile:
    # RELEASE_ENABLED is the kill switch for automatic runs; a person can always dispatch.
    if: vars.RELEASE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.triggering_actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    # Locked to master. Holds the deploy key: rulesets let only deploy keys and
    # admins create v* tags and release/v* branches, so only this job can cut a release.
    environment: release
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      # cut-release.sh checks out other trees, so run everything from a copy.
      - name: Stage release scripts
        run: |
          npx tsc -p scripts/ci --outDir "$RUNNER_TEMP/ci"
          cp scripts/ci/*.sh "$RUNNER_TEMP/ci/"
      - name: Plan
        id: plan
        run: node "$RUNNER_TEMP/ci/release.js" plan
        env:
          FORCE_GA: ${{ inputs.force_ga }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Re-dispatch publish for v${{ steps.plan.outputs.version }}
        if: steps.plan.outputs.action == 'publish' && env.DRY_RUN != 'true'
        run: gh workflow run publish.yml --ref "v$VERSION"
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Cut ${{ steps.plan.outputs.action }} ${{ steps.plan.outputs.version }}
        if: steps.plan.outputs.action == 'beta' || steps.plan.outputs.action == 'ga'
        run: '"$RUNNER_TEMP/ci/cut-release.sh" "$ACTION" "$VERSION" "$FROM" "${COMPARE:--}"'
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          VERSION: ${{ steps.plan.outputs.version }}
          FROM: ${{ steps.plan.outputs.from }}
          COMPARE: ${{ steps.plan.outputs.compare }}
          GH_TOKEN: ${{ github.token }}

  stable:
    if: vars.RELEASE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && github.triggering_actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: release # for the Jira secrets
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npx tsc -p scripts/ci --outDir "$RUNNER_TEMP/ci"
      - name: Plan
        id: plan
        run: node "$RUNNER_TEMP/ci/release.js" stable
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

  tag-stable:
    needs: stable
    if: needs.stable.outputs.action == 'stable' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: npm-dist-tag
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing can manage dist-tags from npm 11.21.0.
      - run: npm install -g npm@^11.21.0
      - run: npm dist-tag add "ryuu.js@$VERSION" stable
        env:
          VERSION: ${{ needs.stable.outputs.version }}
