name: Cut Beta

on:
  workflow_dispatch:

concurrency:
  group: cut-beta
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run ci:cut-beta
